name: npm_publish.yml

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Crucial: Trusted Publishing requires npm 11.5.1+
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      # This will show you exactly why it fails without breaking the actual publish
      - name: Test Authentication
        run: npm publish --dry-run --provenance --access public --loglevel verbose

      - name: Actual Publish
        run: npm publish --provenance --access public
