name: Publish to npm

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write # Required for Trusted Publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # DEBUG STEP: This confirms if npm recognizes your GitHub OIDC identity
      - name: Verify npm Identity
        run: npx auth-header --registry https://registry.npmjs.org --token-type id-token
        
      - name: Publish
        run: npm publish --provenance --access public
