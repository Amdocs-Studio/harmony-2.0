name: npm_publish.yml # Match your npm config filename

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write # Vital for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # registry-url removed to prevent token conflicts

      - name: Ensure latest npm
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm publish --provenance --access public
